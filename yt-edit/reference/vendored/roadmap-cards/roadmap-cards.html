<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Roadmap Cards</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: #01100f;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: #01100f;
        overflow: hidden;
      }

      /* Nate's background is one big smooth teal swoosh, not thin ribbons — built
         here in CSS so its shape and brightness are controllable. */
      .sw {
        position: absolute;
        border-radius: 50%;
        filter: blur(130px);
        pointer-events: none;
      }
      #s1 {
        top: -330px;
        left: -420px;
        width: 2900px;
        height: 1080px;
        background: radial-gradient(
          50% 50% at 50% 50%,
          rgba(178, 255, 250, 1),
          rgba(1, 16, 15, 0) 70%
        );
      }
      #s2 {
        top: -360px;
        left: 640px;
        width: 1700px;
        height: 900px;
        background: radial-gradient(
          50% 50% at 50% 50%,
          rgba(210, 255, 252, 0.78),
          rgba(1, 16, 15, 0) 68%
        );
      }
      #s3 {
        bottom: -520px;
        left: -320px;
        width: 1900px;
        height: 1000px;
        background: radial-gradient(
          50% 50% at 50% 50%,
          rgba(60, 215, 208, 0.45),
          rgba(1, 16, 15, 0) 70%
        );
      }
      #vig {
        position: absolute;
        inset: 0;
        opacity: 0.72;
        background: radial-gradient(
          72% 62% at 50% 46%,
          rgba(0, 0, 0, 0) 38%,
          rgba(0, 10, 10, 0.52) 100%
        );
      }

      #title {
        position: absolute;
        top: 96px;
        left: 0;
        width: 100%;
        text-align: center;
        font-family: "Inter", system-ui, sans-serif;
        font-weight: 800;
        font-size: 96px;
        letter-spacing: -0.02em;
        color: #fff;
        opacity: 0;
        text-shadow:
          0 0 46px rgba(120, 255, 246, 0.35),
          0 8px 40px rgba(0, 0, 0, 0.6);
      }
      #title .n {
        color: #5ff3e6;
        text-shadow: 0 0 40px rgba(95, 243, 230, 0.85);
      }

      #row {
        position: absolute;
        top: 288px;
        left: 0;
        width: 100%;
        perspective: 2400px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 44px;
      }
      .card {
        width: 412px;
        height: 600px;
        transform-style: preserve-3d;
        border-radius: 40px;
        position: relative;
        /* the teal glass fill Nate's have — lighter at the top, never near-black */
        /* translucent, so the band glows through — the card is a lens, not a panel */
        background: linear-gradient(
          168deg,
          rgba(150, 255, 248, 0.2) 0%,
          rgba(70, 200, 198, 0.15) 34%,
          rgba(10, 58, 62, 0.3) 78%,
          rgba(4, 26, 30, 0.46) 100%
        );
        backdrop-filter: blur(3px);
        border: 1.6px solid rgba(190, 255, 250, 0.72);
        box-shadow:
          0 0 110px rgba(90, 245, 234, 0.55),
          0 26px 70px rgba(0, 0, 0, 0.5),
          inset 0 2px 0 rgba(235, 255, 253, 0.8),
          inset 0 26px 60px rgba(180, 255, 250, 0.16),
          inset 0 -40px 90px rgba(0, 40, 42, 0.3);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 34px 28px 48px;
        will-change: filter, transform, opacity;
      }
      .card::before {
        content: "";
        position: absolute;
        top: -1px;
        left: 12%;
        width: 76%;
        height: 3px;
        border-radius: 3px;
        background: linear-gradient(
          90deg,
          rgba(150, 255, 246, 0),
          rgba(226, 255, 253, 1),
          rgba(150, 255, 246, 0)
        );
        box-shadow: 0 0 30px rgba(140, 255, 246, 1);
      }
      .card::after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: 20%;
        width: 60%;
        height: 2px;
        border-radius: 2px;
        background: linear-gradient(
          90deg,
          rgba(120, 245, 236, 0),
          rgba(160, 255, 250, 0.75),
          rgba(120, 245, 236, 0)
        );
        box-shadow: 0 0 22px rgba(120, 245, 236, 0.8);
      }
      .num {
        position: absolute;
        top: 26px;
        left: 32px;
        font-family: "Playfair Display", Georgia, serif;
        font-style: italic;
        font-weight: 800;
        font-size: 40px;
        color: #fff;
        text-shadow: 0 0 20px rgba(150, 255, 246, 0.6);
      }
      .ico {
        margin-top: 92px;
        width: 196px;
        height: 196px;
      }
      .ico svg {
        width: 196px;
        height: 196px;
        display: block;
        filter: drop-shadow(0 0 26px rgba(140, 255, 246, 0.85));
      }
      .ttl {
        margin-top: auto;
        margin-bottom: 54px;
        filter: blur(11px);
        opacity: 0.72;
        will-change: filter;
        font-family: "Inter", system-ui, sans-serif;
        font-weight: 700;
        font-size: 47px;
        line-height: 1.2;
        color: #eafffd;
        text-align: center;
        text-shadow: 0 0 22px rgba(120, 245, 236, 0.45);
      }
      .hot {
        color: #5ff3e6;
      }
      .grow {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 14px;
      }
      .arw {
        font-weight: 800;
        font-size: 36px;
        color: #5ff3e6;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="roadmap-cards"
      data-start="0"
      data-duration="15.9"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div class="sw" id="s1"></div>
      <div class="sw" id="s2"></div>
      <div class="sw" id="s3"></div>
      <div id="vig"></div>
      <div id="title"><span class="n">3</span> things first</div>
      <div id="row">
        <div class="card" id="c0">
          <div class="num">1</div>
          <div class="ico">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="#eafffd"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="7.4" height="7.4" rx="2.2" />
              <rect x="13.6" y="3" width="7.4" height="7.4" rx="2.2" />
              <rect x="3" y="13.6" width="7.4" height="7.4" rx="2.2" />
              <rect x="13.6" y="13.6" width="7.4" height="7.4" rx="2.2" />
            </svg>
          </div>
          <div class="ttl">What<br />Blotato is</div>
        </div>
        <div class="card" id="c1">
          <div class="num">2</div>
          <div class="ico">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="#eafffd"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2.4" y="4" width="19.2" height="13" rx="2.6" />
              <path d="M10 8.6l5.2 2.9-5.2 2.9z" fill="#eafffd" stroke="none" />
              <path d="M8 20.6h8" />
            </svg>
          </div>
          <div class="ttl">A live<br />demo</div>
        </div>
        <div class="card" id="c2">
          <div class="num">3</div>
          <div class="ico">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="#eafffd"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 17.2l5.6-5.6 3.6 3.6L21 5.2" />
              <path d="M15 5.2h6v6" />
            </svg>
          </div>
          <div class="ttl grow">
            <span>40K</span><span class="arw">&#8594;</span> <span class="hot" id="grew">40K</span>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        // Reveal times, one per card — set these to the moment the VO names each
        // item. The cards are all present and SHARP from the first frame; only the
        // TITLE is blurred, and it resolves on cue. Blurring the whole card reads as
        // a fade-in and loses the "here is what is coming" beat entirely.
        var AT = [0.42, 4.3, 11.1];
        var TILT = [7, 0, -7]; // outer cards angle inward, like his
        var tl = gsap.timeline({ paused: true });
        tl.fromTo("#root", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0);
        tl.fromTo(
          "#title",
          { opacity: 0, y: -16, filter: "blur(12px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.54, ease: "power3.out" },
          0.08,
        );
        tl.fromTo("#s1", { x: -60 }, { x: 60, duration: 15.9, ease: "none" }, 0);
        tl.fromTo("#s2", { x: 50 }, { x: -50, duration: 15.9, ease: "none" }, 0);

        ["#c0", "#c1", "#c2"].forEach(function (c, i) {
          // the whole card RISES in, already sharp — only its title stays blurred
          tl.fromTo(
            c,
            { opacity: 0, y: 108, rotateY: TILT[i], scale: 0.94 },
            { opacity: 1, y: 0, rotateY: TILT[i], scale: 1, duration: 0.78, ease: "power3.out" },
            0.14 + i * 0.13,
          );

          // barely-there float: 7-9px over ~2.7s, each card on its own phase so
          // they never move in lockstep
          var amp = [8, 6.5, 9][i],
            per = [2.9, 3.3, 2.6][i],
            start = 0.14 + i * 0.13 + 0.8;
          tl.to(
            c,
            {
              y: -amp,
              rotateZ: (i - 1) * 0.35,
              duration: per,
              ease: "sine.inOut",
              repeat: 5,
              yoyo: true,
            },
            start,
          );
          // …and the title resolves out of the blur when he names it
          tl.to(
            c + " .ttl",
            { filter: "blur(0px)", opacity: 1, duration: 0.46, ease: "power2.out" },
            AT[i],
          );
          tl.fromTo(
            c,
            {
              boxShadow:
                "0 0 110px rgba(90,245,234,.55), 0 26px 70px rgba(0,0,0,.5), inset 0 2px 0 rgba(235,255,253,.80), inset 0 26px 60px rgba(180,255,250,.16), inset 0 -40px 90px rgba(0,40,42,.30)",
            },
            {
              boxShadow:
                "0 0 150px rgba(120,255,246,.85), 0 26px 70px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.95), inset 0 26px 60px rgba(200,255,252,.24), inset 0 -40px 90px rgba(0,40,42,.30)",
              duration: 0.34,
              ease: "power2.out",
            },
            AT[i],
          );
        });

        var g = document.getElementById("grew"),
          o = { v: 40 };
        tl.to(
          o,
          {
            v: 150,
            duration: 0.66,
            ease: "power2.out",
            onUpdate: function () {
              g.textContent = Math.round(o.v) + "K";
            },
          },
          11.45,
        );
        tl.to(g, { scale: 1.1, duration: 0.11, ease: "power2.out" }, 12.11);
        tl.to(g, { scale: 1.0, duration: 0.26, ease: "power2.inOut" }, 12.22);
        tl.to("#root", { opacity: 0, duration: 0.46, ease: "power2.in" }, 15.1);
        tl.set({}, {}, 15.9);
        tl.render(0, true, true);
        window.__timelines["roadmap-cards"] = tl;
      })();
    </script>
  </body>
</html>
