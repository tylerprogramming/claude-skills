<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Red Pop</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      #highlight {
        pointer-events: none;
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #hl-video {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hl-overlay {
        position: absolute;
        inset: 0;
        background: transparent;
        z-index: 1;
        pointer-events: none;
      }
      #hl-container {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }
      .hl-group {
        position: absolute;
        /* real position is set per-group in hfBuild from ANCHOR */
        top: 0;
        left: 0;
        width: 100%;
        display: flex;
        /* single line, always — grouping guarantees each card fits at the target size */
        flex-wrap: nowrap;
        white-space: nowrap;
        align-items: flex-start;
        justify-content: center;
        gap: 14px;
        padding: 0 100px;
        opacity: 0;
        visibility: hidden;
      }
      .hl-word {
        font-family: "Anton", sans-serif;
        font-weight: 400;
        font-size: 80px;
        text-transform: uppercase;
        color: var(--hf-caption-primary, #ffffff);
        display: inline-block;
        letter-spacing: 0;
        line-height: 1.1;
        position: relative;
        padding: 0;
        /* stroke behind fill keeps the letterforms full-weight while giving a hard
           black edge that survives the bright blue backdrop */
        -webkit-text-stroke: 7px #000;
        paint-order: stroke fill;
        text-shadow: 0 5px 14px rgba(0, 0, 0, 0.55);
        transform-origin: 50% 55%;
        will-change: transform, color;
      }
      .hl-word-text {
        position: relative;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="highlight"
      data-composition-id="caption-red-pop"
      data-timeline-locked
      data-start="0"
      data-duration="8"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div class="hl-overlay"></div>
      <div id="hl-container"></div>
    </div>

    <script>
      (function () {
        var HF_COMPOSITION_ID = "caption-red-pop";
        var HF_ROOT_ID = "highlight";
        var HF_GROUP_SELECTOR = ".hl-group";

        /* ─────────────── style config — the only knobs you normally touch ───────────
         * CAPTION_SCALE  1 fits ~4 words per line at 1080 wide. Larger values keep the
         *                one-line rule by packing FEWER words per card (the grouping
         *                measures real width), so 1.5 ≈ 3-4 words, 2 ≈ 2-3.
         * ANCHOR         "seam"   — top edge at H*ANCHOR_AT + ANCHOR_OFFSET. Built for
         *                           split-screen clips (screen above, camera below):
         *                           captions ride just under the seam.
         *                "bottom" — classic lower-third.
         * NOTE the root's data-width / data-height / data-duration below are read by the
         * COMPILER before this script runs. The runtime overrides them from
         * caption-data.json, but the render is already sized/framed by the static
         * values — set them to your clip before rendering.
         * ─────────────────────────────────────────────────────────────────────────── */
        var CAPTION_SCALE = 1.5;
        var ANCHOR = "bottom";
        var ANCHOR_AT = 0.5;
        var ANCHOR_OFFSET = 30;
        var ACTIVE_COLOR = "#ff1a1a";
        var POP_SCALE = 1.07;

        window.__timelines = window.__timelines || {};

        var HF_DEMO_DATA = {
          version: 1,
          // must agree with the static data-width/data-height above: the compiler sizes
          // the render from those, while the runtime lays out from this
          resolution: { width: 1080, height: 1920 },
          segments: [
            {
              start: 0,
              text: "Every great video starts with a single frame. HyperFrames lets you write HTML and render professional video. No timeline. No drag and drop. Just code that becomes cinema.",
              words: [
                { text: "Every", start: 0.0, end: 0.3 },
                { text: "great", start: 0.3, end: 0.55 },
                { text: "video", start: 0.55, end: 0.85 },
                { text: "starts", start: 0.85, end: 1.1 },
                { text: "with", start: 1.1, end: 1.25 },
                { text: "a", start: 1.25, end: 1.35 },
                { text: "single", start: 1.35, end: 1.65 },
                { text: "frame.", start: 1.65, end: 2.0 },
                { text: "HyperFrames", start: 2.1, end: 2.65 },
                { text: "lets", start: 2.65, end: 2.85 },
                { text: "you", start: 2.85, end: 2.95 },
                { text: "write", start: 2.95, end: 3.15 },
                { text: "HTML", start: 3.15, end: 3.55 },
                { text: "and", start: 3.55, end: 3.65 },
                { text: "render", start: 3.65, end: 3.95 },
                { text: "professional", start: 3.95, end: 4.45 },
                { text: "video.", start: 4.45, end: 4.8 },
                { text: "No", start: 4.9, end: 5.05 },
                { text: "timeline.", start: 5.05, end: 5.45 },
                { text: "No", start: 5.5, end: 5.65 },
                { text: "drag", start: 5.65, end: 5.85 },
                { text: "and", start: 5.85, end: 5.95 },
                { text: "drop.", start: 5.95, end: 6.25 },
                { text: "Just", start: 6.35, end: 6.55 },
                { text: "code", start: 6.55, end: 6.8 },
                { text: "that", start: 6.8, end: 6.95 },
                { text: "becomes", start: 6.95, end: 7.3 },
                { text: "cinema.", start: 7.3, end: 7.7 },
              ],
            },
          ],
        };

        /* ── HyperFrames caption-data runtime (shared across caption templates) ── */
        var HF_CONTRACT_VERSION = 1;
        var HF_DEFAULT_RESOLUTION = { width: 1920, height: 1080 };

        function hfFlattenSegments(segments) {
          var out = [];
          (segments || []).forEach(function (seg) {
            ((seg && seg.words) || []).forEach(function (w) {
              var start = Math.max(0, Number(w.start) || 0);
              out.push({
                text: String(w.word || w.text || "").trim(),
                start: start,
                end: Math.max(start, Number(w.end) || 0),
              });
            });
          });
          out.sort(function (a, b) {
            return a.start - b.start;
          });
          return out.filter(function (w) {
            return w.text.length > 0;
          });
        }

        function hfDeriveDuration(words) {
          var end = 0;
          words.forEach(function (w) {
            if (w.end > end) end = w.end;
          });
          return end;
        }

        function hfValidate(data) {
          if (!data || typeof data !== "object") return { ok: false, reason: "not-an-object" };
          if (data.version != null) {
            // Number("v2") is NaN and NaN > x is always false — an explicit
            // finite check keeps malformed versions from slipping past the gate.
            var hfVersion = Number(data.version);
            if (!Number.isFinite(hfVersion) || Math.floor(hfVersion) > HF_CONTRACT_VERSION) {
              return { ok: false, reason: "unsupported-version" };
            }
          }
          if (!Array.isArray(data.segments) || data.segments.length === 0) {
            return { ok: false, reason: "no-segments" };
          }
          if (data.displayMode != null && data.displayMode !== "full") {
            return { ok: false, reason: "unsupported-displayMode" };
          }
          var words = hfFlattenSegments(data.segments);
          if (words.length === 0) return { ok: false, reason: "no-words" };
          return { ok: true, words: words, durationS: hfDeriveDuration(words) };
        }

        function hfApplyStageConfig(data, durationS) {
          var res = (data && data.resolution) || HF_DEFAULT_RESOLUTION;
          // Mirror the published validator's <=8192 bound defensively — the
          // validator is an optional pre-flight, and an unbounded stage size
          // would OOM render workers.
          var W = Math.min(
            8192,
            Math.max(1, Math.round(Number(res.width) || HF_DEFAULT_RESOLUTION.width)),
          );
          var H = Math.min(
            8192,
            Math.max(1, Math.round(Number(res.height) || HF_DEFAULT_RESOLUTION.height)),
          );
          var root = document.getElementById(HF_ROOT_ID);
          [document.documentElement, document.body, root].forEach(function (el) {
            el.style.width = W + "px";
            el.style.height = H + "px";
          });
          root.setAttribute("data-width", String(W));
          root.setAttribute("data-height", String(H));
          root.setAttribute("data-duration", String(durationS));
          var brand = (data && data.brand) || {};
          if (typeof brand.primaryColor === "string" && brand.primaryColor) {
            root.style.setProperty("--hf-caption-primary", brand.primaryColor);
          } else {
            root.style.removeProperty("--hf-caption-primary");
          }
          if (typeof brand.accentColor === "string" && brand.accentColor) {
            root.style.setProperty("--hf-caption-accent", brand.accentColor);
          } else {
            root.style.removeProperty("--hf-caption-accent");
          }
          return {
            W: W,
            H: H,
            scaleX: W / 1920,
            scaleY: H / 1080,
            fontScale: Math.min(W, H) / 1080,
          };
        }

        function hfPublishStatus(status) {
          window.__HF_CAPTION_STATUS = status;
          document
            .getElementById(HF_ROOT_ID)
            .setAttribute("data-caption-status", status.ok ? "ok" : "failed");
        }

        function hfRunGate(words, durationS, failReason) {
          if (failReason) {
            hfPublishStatus({
              ok: false,
              present: false,
              contained: false,
              reason: failReason,
              version: HF_CONTRACT_VERSION,
              durationS: durationS || 0,
            });
            return;
          }
          var root = document.getElementById(HF_ROOT_ID);
          var rootRect = root.getBoundingClientRect();
          var groups = root.querySelectorAll(HF_GROUP_SELECTOR);
          var present = false;
          var contained = true;
          var tokens = [];
          words.forEach(function (w) {
            var t = w.text.toLowerCase().replace(/[^a-z0-9]/g, "");
            if (t) tokens.push(t);
          });
          groups.forEach(function (el) {
            var prevOpacity = el.style.opacity;
            var prevVisibility = el.style.visibility;
            el.style.opacity = "1";
            el.style.visibility = "visible";
            var r = el.getBoundingClientRect();
            if (r.width > 0 && r.height > 0) {
              var text = (el.textContent || "").toLowerCase();
              for (var i = 0; i < tokens.length; i++) {
                if (text.indexOf(tokens[i]) !== -1) {
                  present = true;
                  break;
                }
              }
              if (
                r.left < rootRect.left - 1 ||
                r.right > rootRect.right + 1 ||
                r.top < rootRect.top - 1 ||
                r.bottom > rootRect.bottom + 1
              ) {
                contained = false;
              }
            }
            el.style.opacity = prevOpacity;
            el.style.visibility = prevVisibility;
          });
          hfPublishStatus({
            ok: present && contained,
            present: present,
            contained: contained,
            version: HF_CONTRACT_VERSION,
            durationS: durationS,
          });
        }

        var MAX_WORDS_PER_GROUP = 4;
        var MIN_WORDS_PER_GROUP = 3;
        // 0.1 fragments almost every phrase into 1-2 word groups; 0.6 only breaks on
        // real sentence-level pauses.
        var PAUSE_THRESHOLD = 0.6;

        // Function words that must not be left hanging at the end of a card. The reader
        // sees "...IT'S JUST A" and the card flips, which reads as a sentence ending
        // where there isn't one. Trailing danglers get carried to the next card instead.
        // A word carrying terminal punctuation is exempt — "MACHINE YOU'RE ON." really
        // is the end of a sentence and belongs where it is.
        var DANGLERS = {
          and: 1,
          but: 1,
          or: 1,
          so: 1,
          the: 1,
          a: 1,
          an: 1,
          to: 1,
          of: 1,
          in: 1,
          on: 1,
          for: 1,
          with: 1,
          at: 1,
          from: 1,
          my: 1,
          your: 1,
          its: 1,
          their: 1,
        };
        function hfSplitDangler(g) {
          var carry = [];
          // >= 3 leaves at least two words behind. Allowing it down to 2 clears the last
          // 3 danglers but strands 4 one-word cards, which reads worse than it fixes.
          while (g.length >= 3) {
            var last = g[g.length - 1];
            if (/[.!?]$/.test(last.text)) break;
            if (!DANGLERS[last.text.toLowerCase().replace(/[^a-z']/g, "")]) break;
            carry.unshift(last);
            g = g.slice(0, -1);
          }
          return [g, carry];
        }

        function hfMakeGroups(words, fits, durationS) {
          var raw = [];
          var current = [];
          function close(seed) {
            var split = hfSplitDangler(current);
            if (split[0].length) raw.push(split[0]);
            return split[1].concat(seed || []);
          }
          words.forEach(function (w, i) {
            var next = words[i + 1];
            var test = current.concat([w]);
            if (test.length > MAX_WORDS_PER_GROUP || !fits(test)) {
              current = current.length ? close([w]) : [w];
            } else {
              current.push(w);
            }
            var punctuation = /[,.:!?]$/.test(w.text);
            var pause = next ? next.start - w.end : Infinity;
            if (
              current.length &&
              // only let punctuation end a group once it already has enough words,
              // otherwise "a," / "right?" strand as one-word cards
              ((punctuation && current.length >= MIN_WORDS_PER_GROUP) ||
                pause >= PAUSE_THRESHOLD ||
                current.length >= MAX_WORDS_PER_GROUP ||
                !next)
            ) {
              // on the last word, flush whole — there is no next card to carry into
              if (!next) {
                raw.push(current);
                current = [];
              } else {
                current = close();
              }
            }
          });
          if (current.length) raw.push(current);
          return raw.map(function (ws, gi) {
            var nextStart = gi + 1 < raw.length ? raw[gi + 1][0].start : durationS;
            return {
              words: ws,
              start: ws[0].start,
              // Hold until the next card starts — the stock `nextStart - 0.05` blanked
              // the screen for 1.5 frames between EVERY card (107 gaps, 5.4s total),
              // which reads as a flicker through continuous speech. The
              // lastWord + 0.5 cap still clears the caption during a genuine pause.
              end: Math.min(ws[ws.length - 1].end + 0.5, Math.max(ws[0].start + 0.2, nextStart)),
            };
          });
        }

        function hfTeardown() {
          document.getElementById("hl-container").innerHTML = "";
        }

        function hfBuild(words, layout, durationS) {
          var fontPx = Math.round(80 * layout.fontScale);
          var container = document.getElementById("hl-container");
          var avail = layout.W - 2 * Math.round(100 * layout.scaleX);
          var targetSize = Math.round(fontPx * CAPTION_SCALE);

          // Real-DOM width probe. measureText() can't be trusted here: it silently
          // falls back to a wider system font when the webfont isn't registered in the
          // canvas context, and it can't see the flex gaps or the 7px text-stroke.
          var probe = document.createElement("div");
          probe.className = "hl-group";
          probe.style.visibility = "hidden";
          probe.style.opacity = "0";
          probe.style.top = "0px";
          // .hl-group is width:100% with 100px side padding, so scrollWidth on it
          // reports the CONTAINER width, not the text width. Shrink-wrap the probe so
          // it measures actual content (gaps and text-stroke included).
          probe.style.width = "max-content";
          probe.style.padding = "0";
          probe.style.left = "-99999px";
          container.appendChild(probe);
          function widthAt(ws, size) {
            probe.innerHTML = "";
            ws.forEach(function (w) {
              var s = document.createElement("span");
              s.className = "hl-word";
              s.style.fontSize = size + "px";
              s.textContent = w.text.toUpperCase();
              probe.appendChild(s);
            });
            return probe.scrollWidth;
          }

          var groups = hfMakeGroups(
            words,
            function (ws) {
              return widthAt(ws, targetSize) <= avail;
            },
            durationS,
          );

          var tl = gsap.timeline({ paused: true });
          var wordCounter = 0;

          // ONE size for every caption. Grouping above already guarantees each card
          // fits at targetSize, so the only thing that can still overflow is a single
          // word wider than the frame (which no break can split). Clamp to that worst
          // case so the single-line rule holds unconditionally.
          var uniformSize = targetSize;
          var worst = 1;
          groups.forEach(function (g) {
            var ratio = avail / widthAt(g.words, targetSize);
            if (ratio < worst) worst = ratio;
          });
          if (worst < 1) uniformSize = Math.max(24, Math.floor(targetSize * worst));
          container.removeChild(probe);

          groups.forEach(function (g, gi) {
            var grp = document.createElement("div");
            grp.className = "hl-group";
            grp.id = "hl-grp-" + gi;
            if (ANCHOR === "seam") {
              // Split-screen: ride just under the seam. The offset clears a divider bar
              // and the text-stroke with a little visual breath.
              grp.style.top = Math.round(layout.H * ANCHOR_AT + ANCHOR_OFFSET) + "px";
            } else {
              grp.style.top = "auto";
              grp.style.bottom = Math.round(140 * layout.scaleY) + "px";
            }
            grp.style.paddingLeft = Math.round(100 * layout.scaleX) + "px";
            grp.style.paddingRight = Math.round(100 * layout.scaleX) + "px";

            var ids = [];
            g.words.forEach(function (w) {
              var wi = wordCounter++;
              ids.push(wi);
              var wordEl = document.createElement("span");
              wordEl.className = "hl-word";
              wordEl.id = "hl-w-" + wi;
              wordEl.style.fontSize = uniformSize + "px";
              var textEl = document.createElement("span");
              textEl.className = "hl-word-text";
              textEl.textContent = w.text.toUpperCase();
              wordEl.appendChild(textEl);
              grp.appendChild(wordEl);
            });
            container.appendChild(grp);

            tl.set(grp, { visibility: "visible" }, g.start);
            tl.fromTo(
              grp,
              { opacity: 0 },
              { opacity: 1, duration: 0.06, ease: "power2.out" },
              g.start,
            );
            g.words.forEach(function (w, i) {
              var wordEl = document.getElementById("hl-w-" + ids[i]);
              // as the word is spoken: turn red and pop up slightly...
              tl.to(
                wordEl,
                {
                  color: ACTIVE_COLOR,
                  scale: POP_SCALE,
                  duration: 0.1,
                  ease: "back.out(1.8)",
                  overwrite: "auto",
                },
                w.start,
              );
              // ...then settle back to white at normal size for the next word
              tl.to(
                wordEl,
                {
                  color: "#ffffff",
                  scale: 1,
                  duration: 0.16,
                  ease: "power2.out",
                  overwrite: "auto",
                },
                w.end,
              );
            });
            // Hard cut, no fade-out: a 0.1s fade ending at g.end would dip to
            // transparent exactly as the next card is ramping in, reintroducing the
            // flicker the end-time fix above removes.
            tl.set(grp, { opacity: 0, visibility: "hidden" }, g.end);
          });

          return tl;
        }

        var hfCurrentTimeline = null;

        function hfAttach(data) {
          var v = hfValidate(data);
          if (!v.ok) {
            hfRunGate([], 0, v.reason);
            return;
          }
          if (hfCurrentTimeline) {
            hfCurrentTimeline.kill();
            hfCurrentTimeline = null;
          }
          hfTeardown();
          var layout = hfApplyStageConfig(data, v.durationS);
          var tl = hfBuild(v.words, layout, v.durationS);
          tl.set({}, {}, v.durationS); // pin timeline length to the data-derived duration
          // GSAP quirk (confirmed 3.14.2): a fresh timeline already reports position 0,
          // so seek(0) is treated as a no-op and skips rendering .set() calls scheduled
          // at t=0 — the first frame would show pre-timeline CSS defaults (usually
          // hidden). render(time, suppressEvents, force) with force=true bypasses that.
          tl.render(0, true, true);
          hfCurrentTimeline = tl;
          window.__timelines = window.__timelines || {};
          window.__timelines["caption-red-pop"] = tl;
          hfRunGate(v.words, v.durationS, null);
        }
        window.__HF_CAPTION_ATTACH__ = hfAttach;

        (function hfBoot() {
          function start(data) {
            var ready =
              document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
            ready.then(function () {
              // A manual window.__HF_CAPTION_ATTACH__ call that lands while the
              // sibling fetch / fonts.ready are still pending must win — never
              // clobber it with the late-arriving boot payload.
              if (hfCurrentTimeline) return;
              hfAttach(data);
            });
          }
          if (window.__HF_CAPTION__) {
            start(window.__HF_CAPTION__);
            return;
          }
          fetch("./caption-data.json")
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .catch(function () {
              return null;
            })
            .then(function (json) {
              start(json || HF_DEMO_DATA);
            });
        })();
      })();
    </script>
  </body>
</html>
